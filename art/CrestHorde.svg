  <!-- spiked shoulders, notched top -->
  <path d="M64 16 L42 11 L17 0 L15 22 C14 70 28 101 64 123 C100 101 114 70 112 20 L106 2 L86 9 Z" fill="#0d0d0f" stroke="#0d0d0f" stroke-width="3" stroke-linejoin="round"/>
