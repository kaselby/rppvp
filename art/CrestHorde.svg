<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
 <defs>
  <linearGradient id="iron" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#c9ccd0"/><stop offset=".3" stop-color="#6e737a"/><stop offset=".6" stop-color="#9ea3a9"/><stop offset="1" stop-color="#2a2c30"/></linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b3221c"/><stop offset="1" stop-color="#360303"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4f7fb"/><stop offset=".5" stop-color="#c3cad4"/><stop offset=".51" stop-color="#8a93a0"/><stop offset="1" stop-color="#dfe4ea"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9a868"/><stop offset=".5" stop-color="#a8733a"/><stop offset="1" stop-color="#6a4219"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".75"/></filter>
