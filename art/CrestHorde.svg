   <circle cx="22" cy="40" r="2"/><circle cx="106" cy="40" r="2"/>
   <circle cx="26" cy="70" r="2"/><circle cx="102" cy="70" r="2"/>
   <circle cx="40" cy="98" r="2"/><circle cx="88" cy="98" r="2"/>
