<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
 <!-- Oathbreaker: IconSword with the ring cracked through, tarnished, and the blade snapped. -->
 <defs>
  <linearGradient id="ring" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#c9b9a0"/><stop offset=".35" stop-color="#7d6a4c"/><stop offset=".6" stop-color="#a08c68"/><stop offset="1" stop-color="#3a2a14"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#d8c8a0"/><stop offset=".35" stop-color="#8f7646"/><stop offset=".6" stop-color="#b39d6c"/><stop offset="1" stop-color="#4a3416"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9dde2"/><stop offset=".5" stop-color="#a3a9b2"/><stop offset=".51" stop-color="#6d7480"/><stop offset="1" stop-color="#bfc4ca"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".75"/></filter>
  <mask id="crack">
   <rect width="128" height="128" fill="#fff"/>
   <!-- a jagged split through the ring, upper right -->
   <path d="M64 62 L100 18 L110 26 L97 33 L108 40 L93 45 Z" fill="#000"/>
  </mask>
 </defs>
 <g filter="url(#shadow)">
  <g mask="url(#crack)">
   <path d="M64 18a44 44 0 1 1 0 88a44 44 0 1 1 0-88Zm0 11a33 33 0 1 0 0 66a33 33 0 1 0 0-66Z" fill="#1a1206" fill-rule="evenodd"/>
   <path d="M64 21a41 41 0 1 1 0 82a41 41 0 1 1 0-82Zm0 11a30 30 0 1 0 0 60a30 30 0 1 0 0-60Z" fill="url(#ring)" fill-rule="evenodd"/>
   <circle cx="64" cy="62" r="35.5" fill="none" stroke="#4a3412" stroke-opacity=".7" stroke-width="1.5"/>
  </g>
  <!-- lower half of the blade, snapped -->
  <path d="M58 86 L70 86 L70 52 L67 48 L64 53 L61 47 L58 51 Z" fill="url(#steel)" stroke="#20242b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 56 V84" stroke="#565e6a" stroke-width="1.5"/>
  <!-- upper half, knocked askew -->
  <g transform="rotate(24 64 40) translate(4 -8)">
   <path d="M64 4 L70 16 L70 40 L67 44 L64 39 L61 45 L58 41 L58 16 Z" fill="url(#steel)" stroke="#20242b" stroke-width="2" stroke-linejoin="round"/>
   <path d="M64 13 V38" stroke="#565e6a" stroke-width="1.5"/>
  </g>
  <rect x="40" y="85" width="48" height="8" rx="4" fill="url(#gold)" stroke="#2e200b" stroke-width="2"/>
  <rect x="60" y="93" width="8" height="20" rx="2" fill="#3a2512" stroke="#1d1208" stroke-width="1.6"/>
  <circle cx="64" cy="117" r="6.5" fill="url(#gold)" stroke="#2e200b" stroke-width="1.8"/>
 </g>
</svg>
